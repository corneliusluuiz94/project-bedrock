name: Terraform Apply

on:
  push:
    branches: [main, review]

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      TF_VAR_student_id: ${{ vars.STUDENT_ID }}
      TF_VAR_budget_alert_email: ${{ vars.BUDGET_ALERT_EMAIL }}
    # Real changes to live infrastructure happen here — review the plan on the
    # PR carefully before merging. See assessment section 4.6 for the warning
    # on blast radius.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
